name: Deploy Docs

# Deploy only. Building the site as a PR check is ci-docs.yml's job, so a PR
# no longer builds the docs twice.
on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - "crates/**"
      - ".github/actions/setup-node/**"
      - ".github/actions/setup-rust/**"
      - ".github/actions/build-docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys are not cancelled mid-flight: a half-replaced Pages site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          # Reader: ci-docs.yml owns the wasm cache namespace.
          shared-key: wasm

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Build docs site
        uses: ./.github/actions/build-docs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/build

      # Mirrored into docs.byteveda.org/<slug>/ by ByteVeda/byteveda.site.
      # upload-pages-artifact keeps its artifact for 1 day, too short for the
      # portal's next build to fetch, so publish a longer-lived copy.
      - name: Upload docs for the portal mirror
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs-site/build
          retention-days: 90

  deploy:
    # workflow_dispatch can be aimed at any branch; only master gets published.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
