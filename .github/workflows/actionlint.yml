name: Actionlint

# The pipeline is now several reusable workflows and composite actions, so a
# typo in an expression or a bad `uses:` ref is easy to miss. Lint them.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          matcher: true
