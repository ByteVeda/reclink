name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual re-trigger, for when back-to-back squash merges leave master HEAD
  # without a run because concurrency cancelled it.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo. pull-requests:read lets dorny/paths-filter enumerate
# a PR's changed files.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      python: ${{ steps.decide.outputs.python }}
      docs: ${{ steps.decide.outputs.docs }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Each suite reruns when its own sources, the shared Rust workspace,
          # the composite actions it uses, or its own workflow change.
          # Cargo.lock and uv.lock are deliberately absent: both are gitignored
          # in this repo, so an entry for them could never match.
          filters: |
            shared: &shared
              - 'crates/**'
              - 'Cargo.toml'
              - '.github/actions/setup-rust/**'
              - '.github/workflows/ci.yml'
            rust:
              - *shared
              - '.github/workflows/ci-rust.yml'
            # The bindings are compiled into the wheel, so a crates/ change can
            # break Python at runtime even when the Python sources are untouched.
            python:
              - *shared
              - 'reclink/**'
              - 'tests/python/**'
              - 'pyproject.toml'
              - '.github/actions/setup-python/**'
              - '.github/workflows/ci-python.yml'
            # Unlike a pure MDX site, this one embeds a WASM bundle compiled
            # from the workspace, so it does take *shared.
            docs:
              - *shared
              - 'docs/**'
              - '.github/actions/setup-node/**'
              - '.github/actions/build-docs/**'
              - '.github/workflows/ci-docs.yml'
            release:
              - *shared
              - 'reclink/**'
              - 'pyproject.toml'
              - '.github/actions/setup-python/**'
              - '.github/actions/verify-sdist/**'
              - '.github/workflows/ci-release.yml'

      - name: Decide which suites run
        id: decide
        # FORCE is true on push and workflow_dispatch — run everything there,
        # so master is always covered by a full run. PRs honor the filter.
        env:
          FORCE: ${{ github.event_name != 'pull_request' }}
          RUST: ${{ steps.filter.outputs.rust }}
          PYTHON: ${{ steps.filter.outputs.python }}
          DOCS: ${{ steps.filter.outputs.docs }}
          RELEASE: ${{ steps.filter.outputs.release }}
        run: |
          decide() {
            if [ "$FORCE" = "true" ] || [ "$2" = "true" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          decide rust "$RUST"
          decide python "$PYTHON"
          decide docs "$DOCS"
          decide release "$RELEASE"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yml

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/ci-python.yml

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/ci-docs.yml

  release-readiness:
    name: Release readiness
    needs: changes
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/ci-release.yml

  # Single required status check. Every suite is skippable, so branch
  # protection cannot depend on them individually — a skipped job never
  # reports. This one always runs and fails if anything it needs did not
  # succeed or skip.
  ci-status:
    name: CI status
    if: always()
    needs: [changes, rust, python, docs, release-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that no required job failed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(','.join(k for k, v in data.items() if v['result'] not in ('success', 'skipped')))
          ")
          if [ -n "$failed" ]; then
            echo "::error::Failing or cancelled jobs: $failed"
            exit 1
          fi
