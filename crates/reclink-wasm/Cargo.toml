[package]
name = "reclink-wasm"
version = "0.1.1"
edition = "2021"
description = "WebAssembly bindings for the reclink library"
license = "Apache-2.0"
repository = "https://github.com/ByteVeda/reclink"
homepage = "https://docs.byteveda.org/reclink/"

[lib]
crate-type = ["cdylib"]

[dependencies]
reclink-core = { path = "../reclink-core", default-features = false }
wasm-bindgen = "0.2.114"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.91"

# Not used directly. `ahash` (via reclink-core) pulls in getrandom 0.3, which has
# no entropy source on wasm32-unknown-unknown unless the `wasm_js` feature is on.
# Declaring it here unifies that feature onto the same version ahash resolves to,
# so this requirement must track ahash's getrandom, not the latest release.
# The matching `--cfg getrandom_backend="wasm_js"` lives in /.cargo/config.toml.
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
